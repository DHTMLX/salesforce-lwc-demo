<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>Split task extension</title>
	<script src="../../codebase/dhtmlxgantt.js?v=9.0.14"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css?v=9.0.14">
	<style>
		html, body {
			height: 100%;
			padding: 0px;
			margin: 0px;
			overflow: hidden;
		}

		.complex_gantt_bar {
			background: transparent;
			border: none;
		}

		.complex_gantt_bar .gantt_task_progress {
			display: none;
		}
	</style>
</head>

<body>

<div id="gantt_here" style='width:100%; height:100%'></div>
<script>
	gantt.plugins({
		auto_scheduling: true
	});

	gantt.config.auto_types = true;
	gantt.config.auto_scheduling = true;
	gantt.config.auto_scheduling_compatibility = true;
	gantt.locale.labels.section_split = "Display";
	gantt.config.lightbox.project_sections = [
		{name: "description", height: 70, map_to: "text", type: "textarea", focus: true},
		{name: "split", type:"checkbox", map_to: "render", options:[
			{key:"split", label:"Split Task"}
		]},
		{name: "time", type: "duration", readonly: true, map_to: "auto"}
	];
	gantt.config.scales = [
		{unit: "year", step: 1, format: "%Y"},
		{unit: "month", step: 1, format: "%F"}
	];
	gantt.config.open_split_tasks = true;
	gantt.init("gantt_here");
	gantt.parse({
		data: [
			{ id: 1, text: "Validations", parent: 0, open: true, type:"project" },
			{ id: 2, text: "Business Case Validation", parent: 1, start_date: "02-04-2025", duration: 30},
			{ id: 3, text: "Go/No-Go Decision", parent: 1, start_date: "01-05-2025", type:"milestone", duration:0},
			{ id: 4, text: "Implementation", parent: 0, start_date: "01-05-2025", duration: 30},
			{ id: 5, text: "Market Launch", parent: 0, start_date: "01-07-2025", duration: 30},
			{ id: 6, text: "Case Studies", parent: 0, start_date: "01-05-2025", duration: 30},

			{ id: 7, text: "Parent Task", render:"split", parent: 0, open: true, type:"project", start_date: "01-04-2025", duration: 15},
			{ id: 8, text: "Parent Task", split_mode:"inline", parent: 7, open: true, type:"project", start_date: "01-04-2025", duration: 15},
			{ id: 9, text: "Split of Parent Task", color: "red", parent: 7, start_date: "05-05-2025", duration: 30, split_mode:"inline"},
			{ id: 10, text: "Subtask of Parent Task", parent: 7, start_date: "10-05-2025", duration: 30, split_mode:"subrow"},
			{ id: 11, text: "Split Task", parent: 7, render:"split", start_date: "01-04-2025", duration: 10},
			{ id: 12, text: "Split Task 1", parent: 11, start_date: "02-04-2025", duration: 10},
			{ id: 13, text: "Split Task 2", parent: 11 , start_date: "15-04-2025", duration: 10}
		],
		links: [
			{id: "1", source: "2", target: "3", type: "0"},
			{id: "2", source: "3", target: "4", type: "0"}
		]
	});
</script>
</body>
